# Example murmurs job config. Every field is shown; omitted fields take the defaults
# listed here. Print the full schema with: uv run murmurs config schema
schema_version: 5

data:
  input_dir: /path/to/interview/audio
  output_dir: /path/to/murmurs/output   # must not be inside input_dir
  audio_extensions: [".wav", ".m4a", ".mp3"]

sample:
  enabled: false        # true = run on a few files for human quality review
  n_files: 5
  seed: 0               # same seed and inputs always pick the same files

stages:
  start: ingest         # ingest | load_audio | diarize | transcribe | assign_speakers | detect_phi
  end: detect_phi
  resume: true

diarization:
  model: nvidia/Nemotron-3-Diarization
  num_speakers: null    # cap; speakers beyond the N with most talk time become UNKNOWN. null = keep all
  speaker_gap_tolerance_s: 0.5   # words in a gap up to this far from a turn take its speaker
  llm_correction: true

transcription:
  model: nyralabs/CrisperWhisper2.0_large
  backend: auto         # auto | ct2 (transformers is not supported yet)
  language: en
  modes: [verbatim, intended]
  word_timestamps: true
  draft_model: null     # e.g. nyralabs/CrisperWhisper2.0_turbo: faster (speculative decoding), ~0.1% of words differ

deid:
  ner_model: OpenMed/privacy-filter-nemotron-v2
  llm_model: openai/gpt-oss-120b
  llm_server:                   # the local vLLM server (set up by `murmurs models download`)
    gpu_memory_utilization: 0.85  # share of GPU memory vLLM may use
    max_model_len: 32768          # longest prompt + response, in tokens
    startup_timeout_s: 900        # give up if the server is not ready by then
    max_output_tokens: 8192       # cap per response; a cut-off chunk is split in half
    max_concurrency: 64           # requests sent at once (the server batches them)
    reasoning_effort: medium      # low | medium | high (lower is faster, may lower recall)
  prompt_path: null
  redaction_threshold: 0.5
  flag_edge_cases: true
  # Provisional tag set (D10 in docs/tasks/phase2.md); the data owners decide the final one.
  # action: redact (replace with the tag), flag (mark for review) or ignore. NER labels not
  # listed under any type are ignored.
  entity_types:
    - name: PERSON
      tag: "[PERSON_{n}]"
      description: "Names of people: full, first or last names, nicknames and partial names (for example 'Mrs. Ruiz' or 'the Kowalskis')."
      ner_labels: [first_name, last_name, user_name]
      action: redact
    - name: ORGANIZATION
      tag: "[ORGANIZATION_{n}]"
      description: "Named organizations and institutions: companies and employers, schools and colleges, hospitals and clinics, churches, clubs, care homes and other named facilities."
      ner_labels: [company_name]
      action: redact
    - name: LOCATION
      tag: "[LOCATION_{n}]"
      description: "Named places smaller than a country: street addresses, streets, neighbourhoods, towns, cities, counties, states and postcodes."
      ner_labels: [street_address, city, county, state, postcode, coordinate]
      action: redact
    - name: CONTACT
      tag: "[CONTACT_{n}]"
      description: "Phone and fax numbers, email addresses and web addresses."
      ner_labels: [phone_number, email, fax_number, url]
      action: redact
    - name: ID
      tag: "[ID_{n}]"
      description: "Identifying numbers: social security, national ID, medical record, health plan, account, licence, vehicle, device, employee, customer, tax and case numbers."
      ner_labels: [ssn, national_id, medical_record_number, health_plan_beneficiary_number, account_number, certificate_license_number, license_plate, vehicle_identifier, device_identifier, employee_id, customer_id, tax_id, unique_id]
      action: redact
    - name: AGE
      tag: "[AGE_{n}]"
      description: "A person's age."
      ner_labels: [age]
      action: flag
    - name: DATE
      tag: "[DATE_{n}]"
      description: "Specific dates and date references: days, months, years, birthdays."
      ner_labels: [date, date_of_birth, date_time]
      action: flag
    - name: SENSITIVE_ATTRIBUTE
      tag: "[SENSITIVE_ATTRIBUTE_{n}]"
      description: "Religion, sexuality, race or ethnicity, political views and gender."
      ner_labels: [religious_belief, sexuality, race_ethnicity, political_view, gender]
      action: flag
    - name: SOCIOECONOMIC
      tag: "[SOCIOECONOMIC_{n}]"
      description: "Occupation, education level and employment status."
      ner_labels: [occupation, education_level, employment_status]
      action: flag

compute:
  device: auto          # auto | cuda | cpu
  max_gpu_memory_gb: null
  parallel_workers: 1   # worker processes, not threads
