# Example murmurs job config. Every field is shown; omitted fields take the defaults
# listed here. Print the full schema with: uv run murmurs config schema
schema_version: 4

data:
  input_dir: /path/to/interview/audio
  output_dir: /path/to/murmurs/output   # must not be inside input_dir
  audio_extensions: [".wav", ".m4a", ".mp3"]

sample:
  enabled: false        # true = run on a few files for human quality review
  n_files: 5
  seed: 0               # same seed and inputs always pick the same files

stages:
  start: ingest         # ingest | load_audio | diarize | transcribe | assign_speakers | detect_phi
  end: detect_phi
  resume: true

diarization:
  model: nvidia/Nemotron-3-Diarization
  num_speakers: null    # cap; speakers beyond the N with most talk time become UNKNOWN. null = keep all
  speaker_gap_tolerance_s: 0.5   # words in a gap up to this far from a turn take its speaker
  llm_correction: true

transcription:
  model: nyralabs/CrisperWhisper2.0_large
  backend: auto         # auto | ct2 (transformers is not supported yet)
  language: en
  modes: [verbatim, intended]
  word_timestamps: true

deid:
  ner_model: OpenMed/privacy-filter-nemotron-v2
  llm_model: openai/gpt-oss-120b
  llm_server:                   # the local vLLM server (set up by `murmurs models download`)
    gpu_memory_utilization: 0.85  # share of GPU memory vLLM may use
    max_model_len: 32768          # longest prompt + response, in tokens
    startup_timeout_s: 900        # give up if the server is not ready by then
  prompt_path: null
  redaction_threshold: 0.5
  flag_edge_cases: true
  # Illustrative only. Which NER labels map to which entity type, and whether each is
  # redacted, flagged or ignored, is an open question in docs/design.md.
  entity_types:
    - name: PERSON
      tag: "[PERSON_{n}]"
      description: Names of people, including first names, nicknames and partial names.
      ner_labels: [first_name, last_name]
      action: redact
    - name: LOCATION
      tag: "[LOCATION_{n}]"
      description: Cities, towns, streets, addresses and other named places.
      ner_labels: [city, street_address]
      action: redact

compute:
  device: auto          # auto | cuda | cpu
  max_gpu_memory_gb: null
  parallel_workers: 1   # worker processes, not threads
